[project]
name = "xhs-backend"
version = "0.1.0"
description = "小红书运营平台后端（FastAPI + AgentScope）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "aiosqlite>=0.20",
    "redis>=5.0",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "pyyaml>=6.0",
    "agentscope==2.0.11",
    "e2b-code-interpreter>=1.0",
    "pymysql>=1.0,<1.2",
]

[dependency-groups]
dev = [
    "fakeredis>=2.23",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
