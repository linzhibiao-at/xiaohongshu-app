[project]
name = "xiaohongshu-growing"
version = "0.1.0"
description = "小红书起号 agent 数据层：赛道判断、对标拆解、选题、排期与复盘"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9.0"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "N802",
    "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
